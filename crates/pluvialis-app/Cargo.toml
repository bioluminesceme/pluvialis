[package]
name = "pluvialis-app"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
crossbeam-channel = "0.5"

[target.'cfg(windows)'.dependencies]
# Reattaching a GUI subsystem binary to the terminal that launched it, so the
# command line subcommands can actually print.
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_Console",
] }
eframe = "0.35"
egui = "0.35"
# Native Save As dialog. Windows uses the OS file picker; no async runtime
# needed since we call the blocking `save_file`.
rfd = "0.15"
env_logger = "0.11"
log = { workspace = true }
pluvialis-core = { version = "0.1.0", path = "../pluvialis-core" }
thiserror = { workspace = true }
pluvialis-output = { version = "0.1.0", path = "../pluvialis-output" }
pluvialis-python = { version = "0.1.0", path = "../pluvialis-python" }
pluvialis-machine = { version = "0.1.0", path = "../pluvialis-machine" }
serde_json = "1.0.151"

[target.'cfg(windows)'.build-dependencies]
# Embed the app icon (assets/icon.ico) into the .exe so the pinned-taskbar and
# Explorer file icon persist, not just the live-window icon.
winresource = "0.1"

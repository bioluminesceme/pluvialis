[package]
name = "pluvialis-python"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
log = { workspace = true }
thiserror = { workspace = true }
pluvialis-core = { version = "0.1.0", path = "../pluvialis-core" }

# auto-initialize starts the interpreter on first use, so nothing in the app has
# to know Python exists. Embedding means the exe links against a specific
# Python; see the crate docs for which one and why that matters.
pyo3 = { version = "0.29", features = ["auto-initialize"] }

[dev-dependencies]
serde_json = "1"
